name: APK bauen

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: BildWidget

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BildWidget-apk
          path: BildWidget/app/build/outputs/apk/debug/app-debug.apk
